# Laravel: app (FPM), nginx, queue worker and scheduler from one image.
services:
  app:
    image: ghcr.io/yaon1/php-docker-images:8.4-fpm
    volumes: ['./:/app']
    environment: &env
      WAIT_FOR: postgres:5432,redis:6379
      LARAVEL_OPTIMIZE: 1
      PHP_SESSION_SAVE_HANDLER: redis
      PHP_SESSION_SAVE_PATH: tcp://redis:6379
      FPM_PM: static
      FPM_PM_MAX_CHILDREN: 16
    depends_on: [postgres, redis]

  migrate:
    image: ghcr.io/yaon1/php-docker-images:8.4-cli
    volumes: ['./:/app']
    environment:
      <<: *env
      LARAVEL_MIGRATE: 1
    command: ['true'] # hooks do the work, then the container exits

  queue:
    image: ghcr.io/yaon1/php-docker-images:8.4-cli
    volumes: ['./:/app']
    environment: *env
    command: php artisan queue:work --max-jobs=1000 --memory=256
    stop_signal: SIGTERM

  scheduler:
    image: ghcr.io/yaon1/php-docker-images:8.4-cli
    volumes: ['./:/app']
    environment: *env
    command: php artisan schedule:work

  nginx:
    image: nginx:1.27-alpine
    ports: ['8080:80']
    volumes:
      - ./:/app:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

  postgres:
    image: postgres:17-alpine
    environment: { POSTGRES_PASSWORD: secret, POSTGRES_DB: app }

  redis:
    image: redis:7-alpine

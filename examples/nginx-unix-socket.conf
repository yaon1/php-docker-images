# nginx in the same pod/compose project as FPM with FPM_LISTEN=/run/php/fpm.sock
# (share /run/php as a volume). Saves a TCP hop and port management.
upstream php {
    server unix:/run/php/fpm.sock;
}

server {
    listen 80;
    root /app/public;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass php;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        internal;
    }

    location ~ \.php$ {
        return 404;
    }
}

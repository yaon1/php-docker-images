name: Build

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 4 * * 1' # weekly rebuild picks up upstream security patches

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        variant: [fpm, cli]
        target: [prod, dev]
    env:
      TAG: ${{ matrix.php }}-${{ matrix.variant }}${{ matrix.target == 'dev' && '-dev' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build for tests
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          build-args: |
            PHP_VERSION=${{ matrix.php }}
            VARIANT=${{ matrix.variant }}
          load: true
          tags: local/php:${{ env.TAG }}
          cache-from: type=gha,scope=${{ env.TAG }}
          cache-to: type=gha,mode=max,scope=${{ env.TAG }}

      - run: tests/run.sh local/php:${{ env.TAG }} ${{ matrix.variant }} ${{ matrix.target }}

      - name: Trivy scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: local/php:${{ env.TAG }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: sarif
          output: trivy.sarif

      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy.sarif
          category: ${{ env.TAG }}

      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push multi-arch
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          build-args: |
            PHP_VERSION=${{ matrix.php }}
            VARIANT=${{ matrix.variant }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ env.TAG }}
          cache-from: type=gha,scope=${{ env.TAG }}

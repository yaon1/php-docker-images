name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1' # weekly rebuild picks up upstream security patches

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with: { config: .hadolint.yaml }
      - run: shellcheck -x tests/*.sh tests/cases/*.sh rootfs/usr/local/bin/* rootfs/usr/local/lib/docker-php/hooks/*.sh

  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
      id-token: write # keyless cosign signing
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        variant: [fpm, cli]
        target: [prod, dev, media]
        distro: [alpine, debian]
    env:
      TAG: ${{ matrix.php }}-${{ matrix.variant }}${{ matrix.distro == 'debian' && '-debian' || '' }}${{ matrix.target != 'prod' && format('-{0}', matrix.target) || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build for tests
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          build-args: |
            PHP_VERSION=${{ matrix.php }}
            VARIANT=${{ matrix.variant }}
            DISTRO_SUFFIX=${{ matrix.distro == 'alpine' && '-alpine' || '' }}
          load: true
          tags: local/php:${{ env.TAG }}
          cache-from: type=gha,scope=${{ env.TAG }}
          cache-to: type=gha,mode=max,scope=${{ env.TAG }}

      - run: tests/run.sh local/php:${{ env.TAG }} ${{ matrix.variant }} ${{ matrix.target }}

      - name: Trivy scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: local/php:${{ env.TAG }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: sarif
          output: trivy.sarif

      - name: Fail on fixable critical vulnerabilities
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: local/php:${{ env.TAG }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table

      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy.sarif
          category: ${{ env.TAG }}

      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: date
        run: echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Push multi-arch
        id: push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          sbom: true
          provenance: mode=max
          context: .
          target: ${{ matrix.target }}
          build-args: |
            PHP_VERSION=${{ matrix.php }}
            VARIANT=${{ matrix.variant }}
            DISTRO_SUFFIX=${{ matrix.distro == 'alpine' && '-alpine' || '' }}
          platforms: linux/amd64,linux/arm64
          push: true
          # Floating tag plus a dated one, so deployments can pin an exact weekly build.
          tags: |
            ghcr.io/${{ github.repository }}:${{ env.TAG }}
            ghcr.io/${{ github.repository }}:${{ env.TAG }}-${{ steps.date.outputs.date }}
          cache-from: type=gha,scope=${{ env.TAG }}

      - uses: sigstore/cosign-installer@v3
        if: github.event_name != 'pull_request'

      - name: Sign the image (keyless)
        if: github.event_name != 'pull_request'
        run: cosign sign --yes ghcr.io/${{ github.repository }}@${{ steps.push.outputs.digest }}

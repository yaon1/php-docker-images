; Tunables are read from the environment so one image fits every stage.
memory_limit = ${PHP_MEMORY_LIMIT}
upload_max_filesize = ${PHP_UPLOAD_MAX_FILESIZE}
post_max_size = ${PHP_POST_MAX_SIZE}
max_execution_time = ${PHP_MAX_EXECUTION_TIME}
date.timezone = ${PHP_DATE_TIMEZONE}
max_input_vars = ${PHP_MAX_INPUT_VARS}
; Sessions in Redis for multi-replica deployments: PHP_SESSION_SAVE_HANDLER=redis
; PHP_SESSION_SAVE_PATH=tcp://redis:6379
session.save_handler = ${PHP_SESSION_SAVE_HANDLER}
session.save_path = ${PHP_SESSION_SAVE_PATH}
; Frameworks stat thousands of files per request; a bigger realpath cache avoids it.
realpath_cache_size = ${PHP_REALPATH_CACHE_SIZE}
realpath_cache_ttl = 600
display_errors = ${PHP_DISPLAY_ERRORS}
opcache.interned_strings_buffer = ${PHP_OPCACHE_INTERNED_STRINGS}
zend.assertions = ${PHP_ZEND_ASSERTIONS}
; Session cookies: Secure by default (set PHP_SESSION_COOKIE_SECURE=0 for plain-http dev), never readable from JS.
session.cookie_secure = ${PHP_SESSION_COOKIE_SECURE}
session.cookie_httponly = 1
session.cookie_samesite = Lax
session.use_strict_mode = 1
allow_url_fopen = ${PHP_ALLOW_URL_FOPEN}
expose_php = Off

opcache.enable = 1
; Long-running CLI workers (queues) benefit from OPcache too: PHP_OPCACHE_ENABLE_CLI=1
opcache.enable_cli = ${PHP_OPCACHE_ENABLE_CLI}
opcache.memory_consumption = ${PHP_OPCACHE_MEMORY}
opcache.max_accelerated_files = ${PHP_OPCACHE_MAX_FILES}
opcache.validate_timestamps = ${PHP_OPCACHE_VALIDATE_TIMESTAMPS}
opcache.jit = ${PHP_OPCACHE_JIT}
opcache.jit_buffer_size = 64M

; Preloading (PHP_OPCACHE_PRELOAD=/app/config/preload.php for Symfony, or a custom script).
; Empty disables it. Preloaded code is compiled once at FPM start and shared by all workers.
opcache.preload = ${PHP_OPCACHE_PRELOAD}
opcache.preload_user = www-data

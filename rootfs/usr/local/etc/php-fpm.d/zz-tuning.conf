; Pool settings from the environment, so one image fits any container size.
[www]
; Worker stdout/stderr (error_log, echo in CLI scripts) shows up in docker logs.
catch_workers_output = yes
decorate_workers_output = no
pm = ${FPM_PM}
pm.max_children = ${FPM_PM_MAX_CHILDREN}
; FPM refuses to start unless min_spare <= start_servers <= max_spare.
pm.start_servers = ${FPM_PM_START_SERVERS}
pm.min_spare_servers = ${FPM_PM_MIN_SPARE_SERVERS}
pm.max_spare_servers = ${FPM_PM_MAX_SPARE_SERVERS}
pm.max_requests = ${FPM_PM_MAX_REQUESTS}
request_terminate_timeout = ${FPM_REQUEST_TERMINATE_TIMEOUT}
pm.max_requests = ${FPM_PM_MAX_REQUESTS}
request_terminate_timeout = ${FPM_REQUEST_TERMINATE_TIMEOUT}
request_slowlog_timeout = ${FPM_SLOWLOG_TIMEOUT}
; Slow request stack traces go to the container log, next to everything else.
slowlog = /proc/self/fd/2
listen = ${FPM_LISTEN}
